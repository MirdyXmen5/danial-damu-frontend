services:
  - type: web
    name: danial-damu-frontend
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: VITE_API_URL
        value: https://danial-damu-backend.onrender.com
        scope: build
      - key: NODE_VERSION
        value: 20.12.0
